<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP for the renderer. Dev-server HMR needs the ws:/localhost entries
      (Vite websocket + module fetches); tighten those if the dev server is
      ever removed from production builds.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: http://localhost:*; frame-src 'self'"
    />
    <title>CataSoft</title>
  </head>
  <body
    class="bg-white text-black dark:bg-stone-800 dark:text-stone-100 overflow-hidden"
  >
    <div id="root" class="h-screen w-screen"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
