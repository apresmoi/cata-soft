name: Build & Release

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: write

jobs:
  # package.json major.minor is the floor we opt into (set 2.1.0 / 3.0.0 to
  # cut a minor/major). Same major.minor as the latest tag → patch + 1.
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute next version
        id: compute
        run: |
          git fetch --tags --force
          VERSION=$(node <<'EOF'
          const { execSync } = require("child_process");
          const pkg = require("./package.json").version;
          function parse(v) {
            const [major, minor, patch] = String(v)
              .replace(/^v/, "")
              .split(".")
              .map((n) => parseInt(n, 10) || 0);
            return { major, minor, patch };
          }
          function cmp(a, b) {
            return a.major - b.major || a.minor - b.minor || a.patch - b.patch;
          }
          let tags = [];
          try {
            tags = execSync("git tag -l \"v[0-9]*.[0-9]*.[0-9]*\"", {
              encoding: "utf8",
            })
              .split(/\r?\n/)
              .filter(Boolean)
              .map(parse);
          } catch {}
          const pkgV = parse(pkg);
          tags.sort(cmp);
          const latest = tags[tags.length - 1];
          let next;
          if (!latest) {
            next = pkgV;
          } else if (
            pkgV.major > latest.major ||
            (pkgV.major === latest.major && pkgV.minor > latest.minor)
          ) {
            next = pkgV;
          } else {
            next = {
              major: latest.major,
              minor: latest.minor,
              patch: latest.patch + 1,
            };
          }
          process.stdout.write(`${next.major}.${next.minor}.${next.patch}`);
          EOF
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

  build:
    needs: version
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            builder: mac
          - os: windows-latest
            builder: win
          - os: ubuntu-latest
            builder: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Set release version
        if: needs.version.outputs.version != ''
        run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build renderer and main process
        run: npx tsc && npx vite build

      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --${{ matrix.builder }} ${{ needs.version.outputs.version != '' && '--publish always' || '--publish never' }}
